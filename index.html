<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Life Organizer</title>
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Life Organizer">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1 id="viewTitle">Today</h1>
      <p id="viewSub" class="muted"></p>
    </div>
    <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode">🌙</button>
  </header>

  <main>
    <!-- Today -->
    <section id="view-today" class="view active">
      <div class="card hero">
        <div class="ring-wrap">
          <svg viewBox="0 0 36 36" class="ring">
            <circle cx="18" cy="18" r="15.9" class="ring-bg"/>
            <circle cx="18" cy="18" r="15.9" class="ring-fg" id="ringFg"/>
          </svg>
          <span id="ringText">0%</span>
        </div>
        <div>
          <h2 id="greeting">Hello</h2>
          <p class="muted" id="todaySummary"></p>
        </div>
      </div>

      <h3 class="section-title">Today's schedule</h3>
      <div id="todayEvents" class="list"></div>

      <h3 class="section-title">Today's tasks</h3>
      <div id="todayTasks" class="list"></div>

      <div id="overdueWrap" hidden>
        <h3 class="section-title danger">Overdue</h3>
        <div id="overdueTasks" class="list"></div>
      </div>
    </section>

    <!-- Tasks -->
    <section id="view-tasks" class="view">
      <div class="chips" id="taskFilters">
        <button class="chip active" data-filter="open">Open</button>
        <button class="chip" data-filter="today">Today</button>
        <button class="chip" data-filter="upcoming">Upcoming</button>
        <button class="chip" data-filter="nodate">No date</button>
        <button class="chip" data-filter="done">Done</button>
      </div>
      <div class="chips" id="catFilters"></div>
      <div id="taskList" class="list"></div>
    </section>

    <!-- Schedule -->
    <section id="view-schedule" class="view">
      <div class="week-nav">
        <button class="icon-btn" id="prevWeek" aria-label="Previous week">←</button>
        <button class="link-btn" id="thisWeek">This week</button>
        <button class="icon-btn" id="nextWeek" aria-label="Next week">→</button>
      </div>
      <div class="week-strip" id="weekStrip"></div>
      <h3 class="section-title" id="dayTitle"></h3>
      <div id="dayEvents" class="list"></div>
      <h3 class="section-title">Tasks for this day</h3>
      <div id="dayTasks" class="list"></div>
    </section>

    <!-- Settings -->
    <section id="view-settings" class="view">
      <div class="card">
        <label class="field">
          <span>Your name</span>
          <input id="userName" placeholder="e.g. Ragad">
        </label>
      </div>
      <div class="card">
        <h3>Categories</h3>
        <div id="catManage" class="chips wrap"></div>
        <form id="catForm" class="row">
          <input id="catInput" placeholder="New category" required>
          <button class="btn">Add</button>
        </form>
      </div>
      <div class="card">
        <h3>Backup</h3>
        <p class="muted small">Your data is stored on this device only. Export it to move it to another device or keep a copy.</p>
        <div class="row">
          <button class="btn" id="exportBtn">Export</button>
          <label class="btn ghost">Import<input type="file" id="importInput" accept="application/json" hidden></label>
        </div>
      </div>
      <div class="card">
        <button class="btn danger-btn" id="clearDone">Delete completed tasks</button>
      </div>
    </section>
  </main>

  <button class="fab" id="fab" aria-label="Add">+</button>

  <nav class="tabbar">
    <button data-view="today" class="active"><span>☀︎</span>Today</button>
    <button data-view="tasks"><span>✓</span>Tasks</button>
    <button data-view="schedule"><span>▦</span>Schedule</button>
    <button data-view="settings"><span>⚙︎</span>Settings</button>
  </nav>

  <!-- Task dialog -->
  <dialog id="taskDialog" class="sheet">
    <form method="dialog" id="taskForm">
      <h3 id="taskDialogTitle">New task</h3>
      <input name="title" placeholder="What needs doing?" required autocomplete="off">
      <textarea name="notes" rows="2" placeholder="Notes (optional)"></textarea>
      <div class="grid2">
        <label class="field"><span>Date</span><input type="date" name="due"></label>
        <label class="field"><span>Time</span><input type="time" name="time"></label>
      </div>
      <div class="grid2">
        <label class="field"><span>Priority</span>
          <select name="priority">
            <option value="high">High</option>
            <option value="med" selected>Medium</option>
            <option value="low">Low</option>
          </select>
        </label>
        <label class="field"><span>Category</span><select name="category"></select></label>
      </div>
      <div class="actions">
        <button type="button" class="btn ghost danger-text" id="taskDelete" hidden>Delete</button>
        <span class="spacer"></span>
        <button type="button" class="btn ghost" data-close>Cancel</button>
        <button class="btn" value="save">Save</button>
      </div>
    </form>
  </dialog>

  <!-- Event dialog -->
  <dialog id="eventDialog" class="sheet">
    <form method="dialog" id="eventForm">
      <h3 id="eventDialogTitle">New event</h3>
      <input name="title" placeholder="Event name (class, work, gym...)" required autocomplete="off">
      <input name="place" placeholder="Location (optional)" autocomplete="off">
      <label class="field"><span>Date</span><input type="date" name="date" required></label>
      <div class="grid2">
        <label class="field"><span>From</span><input type="time" name="start" required></label>
        <label class="field"><span>To</span><input type="time" name="end"></label>
      </div>
      <label class="field"><span>Repeat</span>
        <select name="repeat">
          <option value="none">Does not repeat</option>
          <option value="daily">Daily</option>
          <option value="weekly">Weekly</option>
          <option value="weekdays">Weekdays (Sun–Thu)</option>
        </select>
      </label>
      <div class="field"><span>Color</span>
        <div class="colors" id="colorPicker"></div>
      </div>
      <div class="actions">
        <button type="button" class="btn ghost danger-text" id="eventDelete" hidden>Delete</button>
        <span class="spacer"></span>
        <button type="button" class="btn ghost" data-close>Cancel</button>
        <button class="btn" value="save">Save</button>
      </div>
    </form>
  </dialog>

  <!-- Add choice -->
  <dialog id="addChoice" class="sheet small-sheet">
    <div class="choice">
      <button class="btn big" id="addTaskBtn">✓ Task</button>
      <button class="btn big ghost" id="addEventBtn">▦ Schedule event</button>
    </div>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
